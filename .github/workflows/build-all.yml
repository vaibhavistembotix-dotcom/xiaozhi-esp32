name: Build ALL Boards

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Firmware language"
        default: "en-US"
      wake_word:
        description: "Wake word (disabled / hiesp / nihaoxiaozhi)"
        default: "disabled"

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Find all boards and variants
        id: gen
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, glob
          items = []
          for cfg in sorted(glob.glob("main/boards/**/config.json", recursive=True)):
              board = os.path.relpath(os.path.dirname(cfg), "main/boards").replace(os.sep, "/")
              with open(cfg, encoding="utf-8") as f:
                  data = json.load(f)
              for b in data.get("builds", []):
                  items.append({"board": board, "name": b["name"]})
          print("matrix=" + json.dumps({"include": items}))
          EOF

  build:
    needs: set-matrix
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ${{ matrix.name }}
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          . $IDF_PATH/export.sh
          python scripts/build.py ${{ matrix.board }} \
            --name ${{ matrix.name }} \
            --language ${{ github.event.inputs.language }} \
            --wake-word ${{ github.event.inputs.wake_word }}

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: build/merged-binary.bin
